name: new Artifact
on: 
 push: 
  branches: [main]
jobs:
  demo:
   runs-on: ubuntu-latest
   defaults:
      run:
         working-directory: ./Admin
   steps:
     -   uses: actions/checkout@v2.8.0
     -   name: setup Node js
         uses: actions/setup-node@v7.1.0 
         with:
            node-version: 22.x
            cache: "npm"
            cache-dependency-path: ./Admin/package-lock.json
     -  name: npm install
        run: npm ci
     -  name: build
        run: npm run build
     - name: upload a build as an artifact
       uses: actions/upload-artifact@v7.0.2
       with:
          name: Artifact
          path: ./Admin/
        
        
      

              
          
       
      
    
  
  
  
