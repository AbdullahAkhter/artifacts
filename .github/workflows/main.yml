name: new Artifact
on: 
 push: 
  branches: [main]
jobs:
  demo:
   runs-on: ubuntu-latest
   defaults:
     run:
       working-directory: ./Admin
   steps:
     -   uses: actions/checkout@v2.8.0
     -   name: setup Node js
         uses: actions/setup-node@v7.1.0 
         with:
            node-version: 22.x
            cache: "npm"
     -  name: npm install
        run: npm install
     -  name: build
        run: npm run build

      
    
  
  
  
